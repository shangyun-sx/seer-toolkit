# 工具配置 + 打包元数据。
#
# 打包段是为了让桌面客户端（seer-client）能 `pip install -e ../seer-toolkit`
# 直接复用这里的代码，而不是复制一份出去。依赖不在两处维护 —— 直接读
# requirements.txt。
#
# ruff 的规则集是刻意调宽的：目标是「新代码守规矩」，不是「把老代码全改一遍」。
# 老代码的风格问题（超长行、引号不统一等）不在这轮的范围内。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seer-toolkit"
# 注意：这个版本号目前和 web/app.py 的 "2.0.0"、main.py 的 "v1.0" 不一致。
# 统一是清单里的 F12，这里先立一个包版本的锚点。
version = "0.1.0"
description = "赛尔号本地数据工具：INI 解析 / SQLite 图鉴 / 属性克制 / 技能效果 / FastAPI Web"
readme = "README.md"
requires-python = ">=3.9"
# 依赖的唯一来源是 requirements.txt，不在这里重复写
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["cli", "config", "database", "vision", "web"]
# main.py 是脚本入口，不打进包里 —— 照旧 `python main.py` 跑

[tool.setuptools.package-data]
# 前端静态文件必须跟着包走，否则 web 版和客户端打开都是白屏
web = ["static/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
line-length = 120
target-version = "py38"
# 游戏数据目录不参与检查
extend-exclude = ["data", "识图"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes —— 未定义名字、未使用的导入/变量等真问题
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    # 行长不强制：现有代码有长行，而且中文字符的实际显示宽度和字符数
    # 对不上，按字符数卡没有意义
    "E501",
]
# 没有启用 "I"（导入排序）：本项目的入口和测试都用
# 「先 sys.path.insert 再 import」把项目根目录塞进 sys.path，
# 这个写法天然违反导入排序规则。要启用就得改掉所有老文件，
# 和「只加配置、不改老代码」冲突。

[tool.ruff.lint.per-file-ignores]
# 以下文件早于 ruff 引入，没有做风格清理（避免污染 git blame）。
# 新代码不要往这里加文件。
"config/account_manager.py" = ["F401"]
"config/ini_parser.py" = ["UP015"]
"main.py" = ["F401", "F541"]
"vision/auto_click.py" = ["F401", "F541"]
"vision/template_match.py" = ["F401", "F541"]
"tests/test_template_match.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试是脚本式写法的（同时兼容 pytest），失败时打印更详细
addopts = "-ra"
