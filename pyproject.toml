# 工具配置 + 打包元数据。
#
# 打包段是为了让桌面客户端（seer-client）能 `pip install -e ../seer-toolkit`
# 直接复用这里的代码，而不是复制一份出去。依赖不在两处维护 —— 直接读
# requirements.txt。
#
# ruff 的规则集是刻意调宽的：目标是「新代码守规矩」，不是「把老代码全改一遍」。
# 老代码的风格问题（超长行、引号不统一等）不在这轮的范围内。

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seer-toolkit"
description = "赛尔号本地数据工具：INI 解析 / SQLite 图鉴 / 属性克制 / 技能效果 / FastAPI Web"
readme = "README.md"
requires-python = ">=3.9"
# 两个都不在这里写死：
#   dependencies -> requirements.txt
#   version      -> config/version.py（代码里也从那儿读，见该模块说明）
dynamic = ["dependencies", "version"]

[tool.setuptools]
packages = ["cli", "config", "database", "vision", "web"]
# main.py 是脚本入口，不打进包里 —— 照旧 `python main.py` 跑

[tool.setuptools.package-data]
# 前端静态文件必须跟着包走，否则 web 版和客户端打开都是白屏
web = ["static/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
# 走 attr（setuptools 会用 AST 解析，不会真去 import）—— 版本号的单一来源
version = {attr = "config.version.__version__"}

[tool.ruff]
line-length = 120
# 项目下限是 3.9（见 requires-python），所以写 py39。
# 以前写的是 py38 —— 和 requires-python 对不上，而且那个数字纯粹是遗留的。
target-version = "py39"
# 游戏数据目录不参与检查
extend-exclude = ["data", "识图"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes —— 未定义名字、未使用的导入/变量等真问题
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    # 行长不强制：现有代码有长行，而且中文字符的实际显示宽度和字符数
    # 对不上，按字符数卡没有意义
    "E501",
    # 用 typing.Dict/List/Tuple 还是内置的 dict/list/tuple。
    # 全项目统一用前者（含新写的代码 —— 跟着周围风格走），改成内置写法要动
    # 150 多处、淹没 git blame，和「不改老代码」的约定冲突。所以把这类建议
    # 关掉 —— 注意 target-version 是 py39，这两条不关的话会立刻冒出 151 个。
    "UP006", "UP035",
]
# 没有启用 "I"（导入排序）：本项目的入口和测试都用
# 「先 sys.path.insert 再 import」把项目根目录塞进 sys.path，
# 这个写法天然违反导入排序规则。要启用就得改掉所有老文件，
# 和「只加配置、不改老代码」冲突。

[tool.ruff.lint.per-file-ignores]
# 以下文件早于 ruff 引入，没有做风格清理（避免污染 git blame）。
# 新代码不要往这里加文件。
"config/account_manager.py" = ["F401"]
"config/ini_parser.py" = ["UP015"]
"main.py" = ["F401", "F541"]
"vision/auto_click.py" = ["F401", "F541"]
"vision/template_match.py" = ["F401", "F541"]
"tests/test_template_match.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试是脚本式写法的（同时兼容 pytest），失败时打印更详细
addopts = "-ra"

[tool.mypy]
# 注意：mypy 已经不接受 3.9 了（3.9 已 EOL），所以这里只能写 3.10 —— 而 CI
# 还在测 3.9，两边对不齐。3.9 的兼容性目前只由 CI 的测试 job 兜着。
# 这个不一致是清单里 F12 的一部分，留着统一处理。
python_version = "3.10"
show_error_codes = true
# 老代码里 `def f(x: str = None)` 这种隐式 Optional 写法很多，逐个改会淹没
# git blame。这条关掉对新代码影响很小 —— 想严格的自己写 Optional 表态。
no_implicit_optional = false
# 为了支持「直接 python database/pokedex.py 跑单文件」，这些模块里写了
# try/except 双份 import，mypy 会判成「重复定义」。那是刻意的写法。
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
# 以下几处早于 mypy 引入，没做类型清理（和 ruff 的 per-file-ignores 一个理由：
# 避免污染 git blame）。**新代码不要往这个列表里加模块。**
module = [
    "config.account_manager",
    "database.attributes",
    "database.type_chart",
    "vision.auto_click",
    "vision.template_match",
]
ignore_errors = true

[[tool.mypy.overrides]]
# 测试的正确性由「跑起来」保证，不靠静态检查；而且每个测试文件都有一模一样的
# win32 终端处理（sys.stdout.reconfigure），检查了只会刷屏。
module = ["tests.*"]
ignore_errors = true

[tool.coverage.run]
# main.py 是脚本，也一样算进来；vision/ 是自动点击那条线，不在这里
source = ["cli", "config", "database", "web", "main"]

[tool.coverage.report]
# 本机（Windows）测出来 85%。CI 跑在 Linux 上 —— 那些
# `if sys.platform == 'win32'` 分支的代码体在 Linux 走不到，会低一两个点。
# 所以门槛定 80，留余量：它拦的是「明显掉了」，不是「差一行」。
fail_under = 80
show_missing = true
