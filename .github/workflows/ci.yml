name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支推新提交时，自动取消还在跑的旧任务，省 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 ruff
        run: python -m pip install ruff
      - name: ruff check
        run: ruff check .

  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # 某个版本挂了不影响其它版本跑完，方便一次看清全貌
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 运行测试
        # 只跑离线测试：data/ 里的游戏数据被 .gitignore 排除，CI 上不存在。
        # 需要真实数据的检查项叫 check_real_data，本地用
        #   python tests/test_pokedex.py <雷小伊目录>
        # 单独运行。
        run: python -m pytest tests/ -q
