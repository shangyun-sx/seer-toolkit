name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支推新提交时，自动取消还在跑的旧任务，省 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装检查工具
        # mypy 要能解析 fastapi / numpy 这些导入，所以先把运行时依赖装上。
        # mypy 不放 requirements-dev.txt：mypy 2.x 已不支持 Python 3.9，
        # 而 3.9 还在测试矩阵里，装那儿会让那个 job 挂。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: ruff check
        run: ruff check .
      - name: mypy 类型检查
        run: mypy .
      # 前端逻辑测试也走 pytest（tests/test_frontend.py 里包了一层跑 node），
      # 所以这里不用单独加步骤 —— 出口只有一个。app.js 语法有问题的话，
      # 那个测试会因为加载不了而失败

  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # 某个版本挂了不影响其它版本跑完，方便一次看清全貌
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 防御性依赖：opencv-python 在 Linux 上一般需要 libGL / libglib，
      # 缺了 import cv2 会抛 ImportError。成本很低，留着。
      #
      # 但要说明白：这一步**不是** 2026-10 那次 CI 失败的原因。那次是
      # config/ 包被 .gitignore 的 `Config/` 规则误伤、从未提交，导致
      # ModuleNotFoundError（见 .gitignore 里的说明），和 OpenCV 无关。
      - name: 安装系统依赖 (OpenCV 需要 libGL / libglib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 让"依赖导入不了"变成一个名字明确的失败步骤，而不是伪装成
      # pytest 的收集错误 —— 那样排查要绕一大圈。
      - name: 验证依赖可导入
        run: python -c "import cv2, numpy, fastapi; print('cv2', cv2.__version__)"

      - name: 运行测试
        # 只跑离线测试：data/ 里的游戏数据被 .gitignore 排除，CI 上不存在。
        # 需要真实数据的检查项叫 check_real_data，本地用
        #   python tests/test_pokedex.py <雷小伊目录>
        # 单独运行。
        # 覆盖率门槛配在 pyproject 的 [tool.coverage.report] fail_under 里，
        # 低于它 pytest 会以非零退出码结束。
        run: python -m pytest tests/ -q --cov --cov-report=term-missing
